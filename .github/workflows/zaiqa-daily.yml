name: Daily Zaiqa Ki Kahani Short

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-state-persistence
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check whether Zaiqa channel OAuth is configured
        id: channel_oauth
        env:
          YOUTUBE_OAUTH_CLIENT_JSON_B64: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON_B64 }}
          ZAIQA_YOUTUBE_TOKEN_JSON_B64: ${{ secrets.ZAIQA_YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          if [ -z "$YOUTUBE_OAUTH_CLIENT_JSON_B64" ] || [ -z "$ZAIQA_YOUTUBE_TOKEN_JSON_B64" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Zaiqa channel uploads are paused until its separate OAuth token is configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.channel_oauth.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Python dependencies
        if: steps.channel_oauth.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install -r requirements.txt

      - name: Prepare channel-specific YouTube OAuth files
        if: steps.channel_oauth.outputs.ready == 'true'
        env:
          YOUTUBE_OAUTH_CLIENT_JSON_B64: ${{ secrets.YOUTUBE_OAUTH_CLIENT_JSON_B64 }}
          ZAIQA_YOUTUBE_TOKEN_JSON_B64: ${{ secrets.ZAIQA_YOUTUBE_TOKEN_JSON_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          files = (
              ("YOUTUBE_OAUTH_CLIENT_JSON_B64", Path("credentials/client_secret.json")),
              ("ZAIQA_YOUTUBE_TOKEN_JSON_B64", Path("credentials/zaiqa_token.json")),
          )
          for env_name, output_path in files:
              value = os.environ.get(env_name, "").strip()
              if not value:
                  raise RuntimeError(f"Missing required GitHub secret: {env_name}")
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_bytes(base64.b64decode(value, validate=True))
          PY

      - name: Generate and upload Zaiqa Ki Kahani Short
        if: steps.channel_oauth.outputs.ready == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_INTERACTIVE_LOGIN: "0"
        run: python main.py --config config_zaiqa.yaml

      - name: Persist Zaiqa channel state
        if: always() && steps.channel_oauth.outputs.ready == 'true'
        run: |
          git add -- state/zaiqa/
          if git diff --cached --quiet; then
            echo "No Zaiqa channel state changes to persist."
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update Zaiqa Shorts generation state"
            git push
          fi
